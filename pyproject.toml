[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chipflow"
version = "0.1.0"
description = "Open digital EDA flow: Verilog to verified, placed, timed and routed layout on Nangate45"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = ["numpy>=1.26", "torch>=2.1", "yowasp-yosys>=0.65"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
chipflow = "chipflow.cli:main"

[tool.setuptools]
packages = ["chipflow"]
